<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wow-calendar/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#205d9d" />
    <link rel="apple-touch-icon" href="/wow-calendar/icon-192.png" />
    <link rel="manifest" href="/wow-calendar/manifest.webmanifest" />
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('wow-calendar-theme')
          if (storedTheme === 'dark' || storedTheme === 'light') {
            document.documentElement.dataset.theme = storedTheme
          }
        } catch (_err) {
          // noop
        }
      })()
    </script>
